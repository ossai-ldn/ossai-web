name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**' # Only trigger if changes happen in the web folder
  workflow_dispatch: {} # Allow manual re-deploys from the Actions tab

# GitHub Pages for this repo serves from the `gh-pages` branch (legacy/branch
# source), so the workflow needs write access to push the built site there.
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web # <--- Crucial: Sets context to your subfolder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx expo export --platform web

      # GitHub Pages serves 404.html for unknown paths; Expo emits +not-found.html,
      # so mirror it to preserve the custom 404 page.
      - name: Add Pages 404 fallback
        run: cp dist/+not-found.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          cname: ossai.co.uk
          force_orphan: true
